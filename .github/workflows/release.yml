name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext='${{ matrix.ext }}'
          output="gmcore-${GOOS}-${GOARCH}${ext}"
          go build -ldflags="-s -w" -o "$output" .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: gmcore-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
